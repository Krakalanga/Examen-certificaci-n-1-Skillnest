
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear viaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home">Viajes</a>
            <a href="/logout" class="btn btn-outline-light btn-sm">
                Cerrar sesión
            </a>
        </div>
    </nav>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="card border-0 shadow-sm rounded p-4 w-100" style="max-width: 650px;">

            <h2 class="text-center mb-2">Crear un viaje</h2>

            <p class="text-secondary text-center mb-4">
                Comparte tu próximo destino con otros viajeros.
            </p>

            {% with mensajes = get_flashed_messages() %}
                {% if mensajes %}
                    {% for mensaje in mensajes %}
                        <div class="alert alert-info text-center">
                            {{ mensaje }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/viaje/crear" method="POST">

                <div class="mb-3">
                    <label class="form-label">Destino</label>
                    <input
                        type="text"
                        name="destino"
                        class="form-control"
                        placeholder="Ej: Santiago, Chile"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de inicio</label>
                        <input
                            type="date"
                            name="fecha_inicio"
                            class="form-control"
                            required
                            min="{{ hoy }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de finalización</label>
                        <input
                            type="date"
                            name="fecha_fin"
                            class="form-control"
                            required
                        >
                    </div>

                </div>

                <div class="mb-4">
                    <label class="form-label">Itinerario</label>
                    <textarea
                        name="itinerario"
                        class="form-control"
                        rows="4"
                        maxlength="40"
                        placeholder="Describe brevemente el viaje..."
                        required
                    ></textarea>
                    <div class="form-text">
                        Máximo 40 caracteres.
                    </div>
                </div>

                <div class="d-flex justify-content-between">

                    <a href="/home" class="btn btn-outline-dark">
                        Volver
                    </a>

                    <button type="submit" class="btn btn-dark px-4">
                        Publicar viaje
                    </button>

                </div>

            </form>

        </div>

    </div>


</body>
</html>
